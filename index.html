<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Message</title>
<style>
body {
    font-family: "Poppins", sans-serif;
    background-color: #FAF8F1;
    margin: 0;
    padding: 0;
    text-align: center;
}

.nav {
    height: 12vh;
    width: 100vw;
    background-color: #FFFCFB;
}

.center {
    height: 40vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #F5F5F0;
}

.item {
    font-size: 50px;
    font-weight: 500;
    text-decoration: underline 3px solid rgb(39, 38, 38);
    margin-top: 50px;
}

#bttn1 {
    padding: 20px 30px;
    margin-top: 30px;
    font-size: 24px;
    border-radius: 10px;
    border: none;
    background-color: #FAEAB1;
    cursor: pointer;
}


.modal {
    display: none; 
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5); 
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: #FFF8DC;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.modal-content button {
    padding: 10px 20px;
    margin: 15px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #F44336;
    color: white;
}
</style>
</head>
<body>

<div class="nav"></div>

<div class="center">
    <div class="item">
        Hey, a special message for you
        <br>
        <button id="bttn1">Click Here to get the message</button>
    </div>
</div>


<div id="myModal" class="modal">
    <div class="modal-content">
        <p>Wanna go on a date with me?? 💌</p>
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>
const bttn = document.getElementById("bttn1");
const modal = document.getElementById("myModal");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");


bttn.addEventListener("click", () => {
    modal.style.display = "flex";
});


yesBtn.addEventListener("click", () => {
    modal.querySelector("p").textContent = "Thanks! 😊🤍🤍";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
});

noBtn.addEventListener("click", () => {
    modal.querySelector("p").textContent = "Wanna go on a date with me?? 🤍🤍"; 
});

</script>

</body>
</html>
